# SYSTEM 1 - Zehnder Q600 with free-cooling dampers (UC1).
# The Q is configured (installer menu) to auto-boost to fan 3 when outdoor air can cool the
# building; this ESP32 turns "fan level 3" into a 10 V output for the Lindab FTCU dampers.
# Hardware: AtomS3R (with its screen) + Mini CAN Unit (CAN on the top Grove port, bus-powered) + GP8413 DAC on the
# bottom-pin I2C bus. No Option Box impersonation on this system.
#
# Own node name on purpose: it gets its own build directory, so this firmware can never be
# confused with the development one (ZehnderQAdaptor.yaml) at upload time.
substitutions:
  device_name: zehnder-q-dampers
  friendly_name: Zehnder Q Dampers
  device_description: Zehnder Q600 free-cooling damper controller (fan level 3 -> 10 V)
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  wifi_hotspot_password: !secret wifi_hotspot_password
  ota_password: !secret ota_password
  api_encryption_key: !secret api_encryption_key
  flash_size: 4MB

esphome:
  # Overrides the upstream project name set in base_local.yml; shown in the web page and the API.
  project:
    name: rodwilliams.zehnder-q-dampers
    version: "2026.10.31"

packages:
  documentation: !include documentation_local.yml
  base: !include base_local.yml
  device_base: !include upstream/boards/m5stack-atoms3.yml
  analogue_inputs: !include analogue_inputs_local.yml
  dac: !include dac_local.yml
  uc1: !include uc1_fan3_damper_output.yml
  # On-site display (AtomS3R, GC9107 panel + LP5562 backlight - proven on the UC2 unit, 2026-10-28).
  # The plain AtomS3 has a different panel/backlight wiring, so this build is for the S3R only.
  display_common: !include display_atoms3r_common_local.yml
  display_panel: !include display_atoms3r_gc9107_local.yml
  uc1_screen: !include uc1_status_screen_local.yml

external_components:
  - source:
      type: local
      path: components
    components: [ zehnder_comfoair_q, gp8413 ]
