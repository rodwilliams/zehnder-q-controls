# AtomS3 (plain) panel variant B: ST7735S controller (newer units, built after ~2026-05-14).
# FALLBACK - UNVERIFIED on this ESPHome (2025.7.5). Values are from a config reported working in
# esphome/esphome issue #18815 (generic ST7735 model, 128x128 window in 132x132 RAM at offset
# 2/1, inverted colours, rotated 180 degrees); that report also used pad_width/pad_height, which
# this ESPHome version does not have - if the edges look wrong, that is the first suspect.
# Use only if the GC9107 variant gives a blank/garbled screen.
display:
  - platform: mipi_spi
    id: lcd
    model: ST7735
    spi_id: spi_lcd
    cs_pin: GPIO15
    dc_pin: GPIO33
    reset_pin: GPIO34
    data_rate: 40MHz
    dimensions:
      width: 128
      height: 128
      offset_width: 2
      offset_height: 1
    invert_colors: true
    rotation: 180
    update_interval: 1s
