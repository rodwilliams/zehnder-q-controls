# SYSTEM 2 - Zehnder Q600 humidity boost (UC2).
# The Q is configured (installer menu) to boost on rising humidity, which makes it modulate
# between fan 2 and 3. Goal (UC2): notice that, force fan 3 for ~5-10 min, then let the Q go
# back to Auto.
#
# STAGE 2 (this file as it stands): ACTS FOR REAL. When the Q's Ventilation Mode flips
# Active -> Overruling (its own humidity response) while it is in Auto below fan 3, the ESP32
# sends the Q a timed boost (default 300 s), then lets it go back to
# Auto - see uc2_humidity_boost_local.yml for the trigger evidence and the safeguards. Master
# switch on the device: "Humidity Boost Enabled". Pair it with tools/record_states.py to capture
# what the Q does during and after each forced boost.
#
# Hardware: plain AtomS3 (with screen) + Mini CAN Unit (CAN on the top Grove port, bus-powered). No DAC, no
# dampers, no Option Box impersonation on this system.
#
# Own node name on purpose: its own build directory, so this firmware can never be confused
# with the other projects at upload time.
substitutions:
  device_name: zehnder-q-humidity
  friendly_name: Zehnder Q Humidity
  device_description: Zehnder Q600 humidity-boost monitor/controller (UC2)
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  wifi_hotspot_password: !secret wifi_hotspot_password
  ota_password: !secret ota_password
  api_encryption_key: !secret api_encryption_key
  flash_size: 4MB

esphome:
  # Overrides the upstream project name set in base_local.yml; shown in the web page and the API.
  project:
    name: rodwilliams.zehnder-q-humidity
    version: "2026.10.31"

packages:
  documentation: !include documentation_local.yml
  info_page: !include info_page_local.yml
  service_wifi: !include service_wifi_local.yml
  base: !include base_local.yml
  device_base: !include upstream/boards/m5stack-atoms3.yml
  analogue_inputs: !include analogue_inputs_local.yml
  # On-site display for the PLAIN AtomS3 (ESP32-S3FN8, MAC ...12:bc): SPI 17/21, DC33 CS15 RST34,
  # GPIO16 PWM backlight (M5GFX board_M5AtomS3). Panel GC9107 first; ST7735 file is the fallback.
  display_common: !include display_atoms3_common_local.yml
  display_panel: !include display_atoms3_gc9107_local.yml
  uc2_boost: !include uc2_humidity_boost_local.yml
  uc2_screen: !include uc2_status_screen_local.yml

external_components:
  - source:
      type: local
      path: components
    components: [ zehnder_comfoair_q ]
