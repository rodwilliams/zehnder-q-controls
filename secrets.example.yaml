# Copy to secrets.yaml (which is git-ignored) and fill in. Never commit the real file.
wifi_ssid: "your-wifi-name"
wifi_password: "your-wifi-password"
wifi_hotspot_password: "choose-8-or-more-characters"  # for the board's own fallback hotspot
ota_password: "choose-a-password"                     # protects wireless firmware updates; do not leave empty
api_encryption_key: "generate-with: openssl rand -base64 32"
