# Throwaway diagnostic build: isolates the GP8413 I2C test from CAN entirely. No canbus, no
# zehnder_comfoair_q - just enough to power up over USB-C, join wifi, and scan the I2C bus.
# Currently pointed at the bottom-pin bank (GPIO39/GPIO38) to retest the resoldered cable.
substitutions:
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  wifi_hotspot_password: !secret wifi_hotspot_password
  ota_password: !secret ota_password
  api_encryption_key: !secret api_encryption_key
  flash_size: 4MB

packages:
  device_base: !include upstream/boards/m5stack-atoms3.yml

external_components:
  - source:
      type: local
      path: components
    components: [ gp8413 ]

esphome:
  name: dac-test
  name_add_mac_suffix: true
  friendly_name: DAC Test

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: ${flash_size}
  framework:
    type: esp-idf

logger:
  level: VERBOSE

api:
  encryption:
    key: ${api_encryption_key}

ota:
  platform: esphome
  password: ${ota_password}

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    password: ${wifi_hotspot_password}

i2c:
  sda: GPIO38
  scl: GPIO39
  frequency: 10kHz
  scan: true

gp8413:
  id: gp8413_dac
  address: 0x59
  voltage: 10V

output:
  - platform: gp8413
    id: dac_channel_0
    gp8413_id: gp8413_dac
    channel: 0
  - platform: gp8413
    id: dac_channel_1
    gp8413_id: gp8413_dac
    channel: 1
