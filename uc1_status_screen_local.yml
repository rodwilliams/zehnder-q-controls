# On-site status screen for system 1 (free-cooling dampers). 128x128, redrawn once a second.
#
#   First 5 s after boot: a TEST CARD - 1 px border on the very edge of the panel, colour bars
#   (R G B W grey) and text - so a wrong panel variant / colour order / orientation / offset is
#   obvious immediately. Then the live status page:
#
#     [ Q DAMPERS ]              title bar
#     * 192.168.1.53             WiFi dot (green = connected) + IP
#       -71 dBm                  signal strength as the ESP32 sees it
#     * CAN ok                   CAN dot (green = bus traffic within uc1_bus_timeout_ms)
#     Fan  Medium (2)            fan level as reported by the Q
#     Auto                       Q operating mode (Auto / Manual (limited) / Boost ...)
#     Flow 150 m3/h              supply flow
#     [ CLOSED 0V ]  or  [ OPEN 10V ]     the damper output the DAC is commanded to
#
# Needs: display_atoms3r_common_local.yml + one panel file (id: lcd), uc1_fan3_damper_output.yml
# (ids dampers_open, fan_level_raw via generated packages) and the generated text sensors.
display:
  - id: !extend lcd
    lambda: |-
      const Color BLACK(0, 0, 0), WHITE(255, 255, 255), GREY(140, 140, 140);
      const Color RED(230, 40, 40), GREEN(0, 190, 60), BLUE(30, 70, 170), AMBER(255, 170, 0);
      const int w = it.get_width();
      const int h = it.get_height();
      it.fill(BLACK);

      const bool info_page = id(info_page_on) && (millis() - id(info_page_start) < 60000);
      if (millis() < 6000 || info_page) {
        // ---- QR code to the documentation (start-up splash, or button pressed) ----
        it.fill(WHITE);
        const int qs = id(info_qr)->get_size();
        const int scale = (w - 24) / qs;
        const int qw = qs * scale;
        it.qr_code((w - qw) / 2, 10, id(info_qr), BLACK, scale);
        it.print(w / 2, 10 + qw + 5, id(font_s), BLACK, TextAlign::TOP_CENTER, "Scan for docs");
        it.printf(w / 2, 10 + qw + 17, id(font_s), GREY, TextAlign::TOP_CENTER, "v%s", ESPHOME_PROJECT_VERSION);
        return;
      }

      // ---- live status ----
      const bool wifi_ok = wifi::global_wifi_component->is_connected();
      const bool can_ok = id(comfoair)->bus_alive(${uc1_bus_timeout_ms});
      const bool open = id(dampers_open).has_state() && id(dampers_open).state;
      const float level = id(fan_level_raw).state;
      const float flow = id(supply_fan_flow).state;

      it.filled_rectangle(0, 0, w, 17, BLUE);
      it.print(w / 2, 8, id(font_m), WHITE, TextAlign::CENTER, "Q DAMPERS");

      const bool svc = id(service_wifi_on);
      const int svc_min = svc ? (int) ((${service_wifi_minutes} * 60000UL - (millis() - id(service_wifi_start))) / 60000UL) + 1 : 0;
      it.filled_circle(6, 26, 4, !svc ? GREY : (wifi_ok ? GREEN : AMBER));
      if (!svc) {
        it.print(14, 20, id(font_s), GREY, "WiFi off");
        it.print(14, 33, id(font_s), GREY, "hold btn=service");
      } else if (wifi_ok) {
        it.printf(14, 20, id(font_s), WHITE, "%s", wifi::global_wifi_component->get_ip_addresses()[0].str().c_str());
        it.printf(14, 33, id(font_s), GREY, "%d dBm %d min", (int) wifi::global_wifi_component->wifi_rssi(), svc_min);
      } else {
        it.print(14, 20, id(font_s), AMBER, "WiFi joining...");
        it.printf(14, 33, id(font_s), GREY, "%d min left", svc_min);
      }

      it.filled_circle(6, 52, 4, can_ok ? GREEN : RED);
      it.print(14, 46, id(font_s), can_ok ? WHITE : RED, can_ok ? "CAN ok" : "CAN: no bus");

      if (isnan(level)) {
        it.print(2, 59, id(font_s), AMBER, "Fan  ?");
      } else {
        it.printf(2, 59, id(font_s), WHITE, "Fan  %s (%d)", id(fan_level).state.c_str(), (int) level);
      }
      it.printf(2, 72, id(font_s), GREY, "%s", id(operating_mode).state.c_str());
      if (isnan(flow)) {
        it.print(2, 85, id(font_s), GREY, "Flow --");
      } else {
        it.printf(2, 85, id(font_s), WHITE, "Flow %.0f m3/h", flow);
      }

      // the output the dampers are being driven with (DAC channel 0)
      it.filled_rectangle(0, 101, w, h - 101, open ? AMBER : GREEN);
      it.print(w / 2, 101 + (h - 101) / 2, id(font_l), BLACK, TextAlign::CENTER, open ? "OPEN 10V" : "CLOSED 0V");
