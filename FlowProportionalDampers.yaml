# SYSTEM 3 - Zehnder Q600 with flow-proportional dampers (UC3).
# The 0-10 V output follows the Q's own continuous airflow demand: 0 V at level 2, 10 V at level 3, linear
# in between (humidity modulation, boost and manual High all included). See uc3_flow_proportional_output.yml
# and docs/uc3-flow-proportional.md.
# Hardware: AtomS3R (with its screen) + Mini CAN Unit (CAN on the top Grove port, bus-powered) + GP8413 DAC.
#
# Own node name on purpose: its own build directory, so this firmware can never be confused with the other
# projects at upload time.
substitutions:
  device_name: zehnder-q-flowdampers
  friendly_name: Zehnder Q Flow Dampers
  device_description: Zehnder Q600 flow-proportional damper controller (Q demand 200-300 -> 0-10 V)
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  wifi_hotspot_password: !secret wifi_hotspot_password
  ota_password: !secret ota_password
  api_encryption_key: !secret api_encryption_key
  flash_size: 4MB

esphome:
  # Overrides the upstream project name set in base_local.yml; shown in the web page and the API.
  project:
    name: rodwilliams.zehnder-q-flowdampers
    version: "2026.11.02"

packages:
  documentation: !include documentation_local.yml
  info_page: !include info_page_local.yml
  service_wifi: !include service_wifi_local.yml
  base: !include base_local.yml
  device_base: !include upstream/boards/m5stack-atoms3.yml
  analogue_inputs: !include analogue_inputs_local.yml
  dac: !include dac_local.yml
  uc3: !include uc3_flow_proportional_output.yml
  display_common: !include display_atoms3r_common_local.yml
  display_panel: !include display_atoms3r_gc9107_local.yml
  uc3_screen: !include uc3_status_screen_local.yml

external_components:
  - source:
      type: local
      path: components
    components: [ zehnder_comfoair_q, gp8413 ]
